<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="plateBg" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#35312c"/>
      <stop offset="0.42" stop-color="#1e1b18"/>
      <stop offset="1" stop-color="#0a0908"/>
    </linearGradient>
    <linearGradient id="plateSheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="0.35" stop-color="#ffffff" stop-opacity="0.03"/>
      <stop offset="0.62" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="plateRim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="polaroidPaper" x1="0.02" y1="0" x2="0.55" y2="1">
      <stop offset="0" stop-color="#fefcf9"/>
      <stop offset="0.45" stop-color="#f5f1e9"/>
      <stop offset="1" stop-color="#dbd4c5"/>
    </linearGradient>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0.15" y2="1">
      <stop offset="0" stop-color="#ffdda6"/>
      <stop offset="0.18" stop-color="#f2b75e"/>
      <stop offset="0.44" stop-color="#e8a33d"/>
      <stop offset="0.62" stop-color="#c07f27"/>
      <stop offset="0.7" stop-color="#56320d"/>
      <stop offset="1" stop-color="#150d04"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fffdf4" stop-opacity="0.95"/>
      <stop offset="0.3" stop-color="#ffe6bb" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#ffe6bb" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cardHalo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.3" stop-color="#e8a33d" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#e8a33d" stop-opacity="0"/>
    </radialGradient>
    <filter id="blurHalo" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="52"/>
    </filter>
    <filter id="blurSun" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="11"/>
    </filter>
    <filter id="blurCardShadow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
    <clipPath id="photoClip">
      <rect x="338" y="282" width="348" height="396" rx="4"/>
    </clipPath>
  </defs>

  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#plateBg)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#plateSheen)"/>
  <rect x="101" y="101" width="822" height="822" rx="184"
        fill="none" stroke="url(#plateRim)" stroke-width="2"/>

  <ellipse cx="512" cy="500" rx="306" ry="316" fill="url(#cardHalo)" filter="url(#blurHalo)"/>
  <rect x="296" y="250" width="434" height="542" rx="18"
        fill="#000000" opacity="0.6" filter="url(#blurCardShadow)"/>
  <rect x="292" y="236" width="440" height="552" rx="18" fill="url(#polaroidPaper)"/>
  <rect x="338" y="282" width="348" height="396" rx="4" fill="url(#skyGrad)"/>
  <g clip-path="url(#photoClip)">
    <ellipse cx="512" cy="551.28" rx="158" ry="112" fill="url(#sunGlow)"/>
    <circle cx="512" cy="557.22" r="31" fill="#fffbf1" opacity="0.92" filter="url(#blurSun)"/>
  </g>
  <rect x="338" y="282" width="348" height="396" rx="4" fill="none"
        stroke="#000000" stroke-opacity="0.26" stroke-width="4"/>
  <rect x="292" y="236" width="440" height="552" rx="18" fill="none"
        stroke="#ffffff" stroke-opacity="0.6" stroke-width="2.5"/>
  <rect x="293.5" y="237.5" width="437" height="549" rx="16"
        fill="none" stroke="#8a8272" stroke-opacity="0.26" stroke-width="2"/>
</svg>